<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل عاشقانه</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="hearts-container" id="hearts"></div>
    <div class="panel">
        <div class="glass-card">
            <div class="header">
                <h1>💕 پنل عاشقانه</h1>
                <p class="sub">اینجا جای قلب‌های مهربونه</p>
            </div>
            <div class="messages" id="messages">
                <div class="message love">
                    <span class="name">❤️ عشق</span>
                    <span class="text">خوش اومدی، پیمان جان</span>
                    <span class="time">الان</span>
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="nameInput" placeholder="اسمت..." value="عاشق" maxlength="20">
                <div class="input-row">
                    <input type="text" id="msgInput" placeholder="چی دوست داری بگی؟..." autofocus>
                    <button id="sendBtn">💌 بفرست</button>
                </div>
            </div>
            <div class="footer">
                <span>💫 هر لحظه با تو زیباست</span>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
                                                             </html>
